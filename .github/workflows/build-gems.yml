---
name: Build gems

on:
  workflow_dispatch:
  push:
    branches: ["main", "cross-gem/*", "pkg/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-data:
    uses: ./.github/workflows/native-gem-matrix.yml
    with:
      # Release branches build the platforms and Ruby versions pinned in their
      # snapshot, if they have one.
      snapshot: ${{ startsWith(github.ref_name, 'release-') }}

  native:
    name: Build native gems
    needs: ci-data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ fromJSON(needs.ci-data.outputs.result).latest-ruby-version }}

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.ruby-platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}

      - uses: actions/upload-artifact@v7
        with:
          name: cross-gem-${{ matrix.ruby-platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  smoke-test:
    name: Smoke test native gem (${{ matrix.ruby-platform }})
    needs: [ci-data, native]
    runs-on: ${{ matrix.os }}
    env:
      BUILT: ${{ contains(fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms, matrix.ruby-platform) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-platform: x86_64-linux
            os: ubuntu-latest
          - ruby-platform: aarch64-linux
            os: ubuntu-24.04-arm
          - ruby-platform: x64-mingw-ucrt
            os: windows-2025
          - ruby-platform: aarch64-mingw-ucrt
            os: windows-11-arm
          - ruby-platform: x86_64-darwin
            os: macos-15-intel
          - ruby-platform: arm64-darwin
            os: macos-15
    steps:
      - name: Skip platforms that aren't built
        if: env.BUILT != 'true'
        run: echo "::notice::${{ matrix.ruby-platform }} isn't built for this ref, skipping"

      - uses: ruby/setup-ruby@v1
        if: env.BUILT == 'true'
        with:
          ruby-version: ${{ fromJSON(needs.ci-data.outputs.result).latest-ruby-version }}

      - uses: actions/download-artifact@v8
        if: env.BUILT == 'true'
        with:
          name: cross-gem-${{ matrix.ruby-platform }}
          path: pkg/

      - name: Smoke gem install
        if: env.BUILT == 'true'
        shell: bash
        run: |
          gem install pkg/wasmtime-*.gem --verbose
          script="precompiled = Wasmtime::Engine.new.precompile_module(%q[(module)]); abort %q[missing wasmtime.info section] unless precompiled.include?(%q[wasmtime.info])"
          ruby -rwasmtime -e "$script"
          echo "✅ Successfully gem installed"

  source:
    name: Build source gem
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        ruby: ["4.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: false
          cache-version: v2

      - name: Smoke test gem install
        shell: bash
        run: bundle exec rake pkg:ruby:test
