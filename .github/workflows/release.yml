---
name: Release

# Releases are normally started by release-tag.yml, which calls this workflow
# from `main` with the tag to release, so releases from release branches also
# use the latest version of this workflow. Running it manually from a branch
# builds and smoke-tests the gems without releasing them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build instead (e.g. release-48). Nothing is released."
        required: false
        type: string
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release
        required: true
        type: string

env:
  # Empty when not releasing a tag.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
  # Empty to check out the ref the workflow runs on.
  CHECKOUT_REF: ${{ inputs.tag || inputs.ref || '' }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  ci-data:
    uses: ./.github/workflows/native-gem-matrix.yml

  build:
    name: Build native gems
    needs: ci-data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.ruby-platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}

      - uses: actions/upload-artifact@v7
        with:
          name: cross-gem-${{ matrix.ruby-platform }}
          path: pkg/*-${{ matrix.ruby-platform }}.gem
          if-no-files-found: error

  smoke-test:
    name: Smoke test native gem (${{ matrix.ruby-platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-platform: x86_64-linux
            os: ubuntu-latest
          - ruby-platform: aarch64-linux
            os: ubuntu-24.04-arm
          - ruby-platform: x64-mingw-ucrt
            os: windows-2025
          - ruby-platform: aarch64-mingw-ucrt
            os: windows-11-arm
          - ruby-platform: x86_64-darwin
            os: macos-15-intel
          - ruby-platform: arm64-darwin
            os: macos-15
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - uses: actions/download-artifact@v8
        with:
          name: cross-gem-${{ matrix.ruby-platform }}
          path: pkg/

      - name: Smoke gem install
        shell: bash
        run: |
          gem install pkg/wasmtime-*.gem --verbose
          script="precompiled = Wasmtime::Engine.new.precompile_module(%q[(module)]); abort %q[missing wasmtime.info section] unless precompiled.include?(%q[wasmtime.info])"
          ruby -rwasmtime -e "$script"
          echo "✅ Successfully gem installed"

  release:
    name: Release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cargo-cache: true
          cache-version: v1

      - uses: actions/download-artifact@v8
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: pkg/

      - name: Package source gem
        run: bundle exec rake pkg:ruby

      - name: Ensure version matches the tag
        if: env.RELEASE_TAG
        run: |
          GEM_VERSION=$(grep VERSION lib/wasmtime/version.rb | head -n 1 | cut -d'"' -f2)
          if [ "v$GEM_VERSION" != "$RELEASE_TAG" ]; then
            echo "Gem version does not match tag"
            echo "  v$GEM_VERSION != $RELEASE_TAG"
            exit 1
          fi

      # Set the `RELEASE_DRY_RUN` repository variable to `true` on forks to test
      # the release flow without publishing to RubyGems.
      - name: Push Gem
        if: env.RELEASE_TAG && vars.RELEASE_DRY_RUN != 'true'
        working-directory: pkg/
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_KEY }}
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
          ls -l
          for i in *.gem; do
            if [ -f "$i" ]; then
              set +e
              gem push "$i" >push.out
              gemerr=$?
              set -e
              if [ "$gemerr" -ne 0 ]; then
                sed 's/^/::error:: /' push.out
                if ! grep -q "Repushing of gem" push.out; then
                  exit $gemerr
                fi
              fi
            fi
          done

      # Releases can be cut from release branches, so neither the most recent
      # tag nor the most recent release is necessarily the previous version.
      - name: Find previous tag and whether this is the latest release
        id: tags
        if: env.RELEASE_TAG
        run: |
          tags=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | sort -V)
          previous=$(echo "$tags" | grep -B1 -x "$RELEASE_TAG" | head -n 1)
          if [ "$previous" = "$RELEASE_TAG" ]; then
            previous=""
          fi
          if [ "$(echo "$tags" | tail -n 1)" = "$RELEASE_TAG" ]; then
            latest=true
          else
            latest=false
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${previous:-none}, latest: $latest"

      - name: Create GitHub release
        if: env.RELEASE_TAG
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          allowUpdates: true
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.tags.outputs.previous }}
          makeLatest: ${{ steps.tags.outputs.latest }}
          draft: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          skipIfReleaseExists: true
